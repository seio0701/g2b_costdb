# 표2 (건축법 시행령 별표1 기준 시설용도) → 검색어. include: 공고명 포함 시 후보, exclude: 포함 시 제외
categories:
  - major: "문화 및 집회시설"
    minor: "공연장"
    include: ["문화예술회관", "문예회관", "예술의전당", "아트센터", "아트홀", "문화회관", "공연장"]
    exclude: ["호선"]          # '2호선 예술의전당역 …' 같은 지하철 공사 제외
  - major: "문화 및 집회시설"
    minor: "미술관"
    include: ["미술관", "아트뮤지엄", "미술박물관"]
    exclude: []
  - major: "문화 및 집회시설"
    minor: "수장고"
    include: ["수장고", "통합수장고", "개방형수장고"]
    exclude: ["정수장", "양수장", "배수장", "취수장", "가압장", "하수장"]   # '정수장 고압' 이 '수장고' 로 잘못 잡히는 것 방지
  - major: "공동주택"
    minor: "공동주택"
    include: ["공공주택", "공공임대주택", "행복주택", "공공실버주택", "영구임대", "국민임대", "통합공공임대"]
    exclude: ["매입"]          # 매입임대(기존 주택 매입)는 건설이 아니므로 제외
  - major: "운동시설"
    minor: "운동장"
    include: ["경기장", "보조경기장", "야구장", "스포츠타운", "종합체육공원", "축구장", "종합운동장"]
    exclude: ["인조잔디", "우레탄", "투광등", "조명", "그물망", "방지망", "학교체육시설", "초등학교", "중학교", "고등학교", "리틀야구장",
              "트랙", "도색", "도장", "탄성포장", "광고판", "호선"]   # 학교 운동장·잔디·조명 등 소규모 공사, 지하철·국도 구간 공사 제외 ('호선'은 환승주차장에는 필요하므로 공통 제외어가 아님)
  - major: "자동차관련시설"
    minor: "주차장"
    include: ["주차전용건축물", "지하공영주차장", "입체식주차장", "환승주차장", "주차타워", "공영주차장 건립", "복합주차장"]
    exclude: ["주차장 정비", "노상"]
  - major: "묘지관련시설"
    minor: "-"
    include: ["화장시설", "화장장", "봉안당", "봉안시설", "추모공원", "승화원", "장사시설"]
    exclude: []
  - major: "관광휴게시설"
    minor: "-"
    include: ["야외음악당", "야외극장", "야외공연장"]
    exclude: []
  - major: "숙박시설"
    minor: "-"
    include: ["호텔", "유스호스텔"]
    exclude: ["호텔관광", "호텔앤", "호텔항공", "호텔경영", "호텔조리", "호텔외식", "호텔스쿨", "호텔서비스", "관광과", "실습실", "학과", "계열", "강의실", "교육환경개선"]   # 학교 학과명(호텔관광과 등) 제외
  - major: "동식물관련시설"
    minor: "-"
    include: ["축산시험장", "유리온실", "온실 건립", "온실 신축", "스마트팜 온실"]
    exclude: ["농가", "ICT융복합", "PO필름", "확산사업"]   # 민간 농가 지원사업 제외
  - major: "창고시설"
    minor: "-"
    include: ["재난물자창고", "재해구호물자", "비축창고"]
    exclude: []

# 모든 분류에 공통으로 적용하는 제외어: 시설명이 지하철역·도로 구간 이름으로만 쓰인 공고(레일 교환, 가로등, 보행자도로 등)
exclude_common: ["운동장역", "경기장역", "미술관역", "회관역", "전당역", "레일교환", "궤도", "가로등", "교통신호기", "횡단보도",
                 "보행자도로", "보행환경", "도시계획도로", "군도", "농로", "농어촌도로", "도로건설", "터널", "교차로", "상수도급수", "급수공사",
                 "하수관", "오수관", "우수관", "맨홀"]

# 사업유형 규칙 (우선순위 순: 먼저 매칭되는 것). 신축·증축·리모델링은 모두 DB 대상, 유지보수만 제외
# 리모델링을 유지보수보다 먼저 두는 이유: '개보수'가 '보수'에 먼저 걸려 유지보수로 오분류되는 것을 방지
work_type_rules:
  리모델링: ["리모델링", "리노베이션", "개보수", "개축", "재건축", "전면개조", "대수선", "증개축", "재구조화", "기능보강 리모델링", "현대화"]
  증축: ["증축", "별관", "확장", "확충", "증설"]
  신축: ["신축", "건립", "건설", "조성", "축조", "신설"]        # '설치공사'는 승강기·조명 등 설비 설치가 대부분이라 제외(→ 미분류 '검토필요')
  유지보수: ["보수", "방수", "도색", "도장", "교체", "개체", "유지", "철거", "정비", "개선", "보강", "리뉴얼", "환경개선", "시설개선", "노후", "재도장",
           "승강기", "하자", "개량", "복구", "석면", "보완", "수선", "점검", "안전진단", "필름",
           # 2026-09 전량 후보 검토에서 추가: 설비·부속물 설치, 조경 관리, 세대 수선
           "교환", "보식", "파종", "수목전지", "수목이식", "수목관리", "전지공사", "도배", "장판", "인입", "방음벽", "차양", "그늘막", "막구조", "휀스",
           "CCTV", "카메라", "감지기", "스코어보드", "전광판", "흡음", "비가림", "경사로", "보일러", "분리막", "난간", "구경변경", "전시연출", "기획전",
           "방음", "식재", "임시주차장", "임시포장", "덧씌우기", "예초", "전정", "제초", "벌초", "디딤돌", "전원공급"]

# 부속·외부 공사 어휘: 시설 본체가 아닌 진입로·주차장·조명 등. 신축 어휘와 함께 있으면 '미분류'(검토필요), 아니면 '유지보수'
ancillary_words: ["진입로", "진출입", "교차로", "도로", "주차장", "주변", "일원", "인근", "보도", "포장", "전시조성", "옥상", "광장", "데크",
                  "그물망", "방지망", "조명", "인조잔디", "울타리", "펜스", "간판", "안내판", "신호등", "관람석 의자", "무대", "배관", "관로",
                  "케이블", "설비", "공조기", "냉난방", "화장실", "장치", "시스템", "개설", "잔디", "관람석"]
# (참고) '설치공사'만 있는 공고는 어느 어휘에도 걸리지 않아 '미분류'(검토필요)가 된다: 야외공연장 설치공사 같은 소규모 신축은 사람이 판단

# 공종 규칙 (공고명·주공종명·업종명 대상)
trade_rules:
  전기: ["전기공사", "전기 공사", "전기공사업", "전기설비"]
  정보통신: ["정보통신", "통신공사", "통신 공사", "정보통신공사업"]
  소방: ["소방시설", "소방공사", "소방시설공사업", "소방설비"]   # 맨 앞 어절이 "소방서"인 건물 공고와 구분
  조경: ["조경", "조경공사업", "조경식재", "조경시설물", "조경식재시설물"]
  기계설비: ["기계설비", "기계설비공사업", "냉난방", "기계가스", "가스난방", "가스시설", "승강기설치"]
  토목: ["토목공사", "토목공사업", "부지조성", "기반시설", "지반조성", "포장공사업", "상하수도", "철도궤도", "수중준설", "철강구조물", "보링그라우팅"]   # "토목건축공사업"은 건축으로 분류(classify_trade)
  건축: ["건축공사", "건축공사업", "건립공사", "신축공사", "건립", "신축", "건축", "증축공사", "종합건설", "토목건축", "건설공사", "조성공사",
         "실내건축", "금속창호", "지붕건축물", "창호", "도장습식방수석", "습식", "철근콘크리트", "구조물해체", "비계"]  # 건설·조성공사는 주공종명·면허가 없을 때만 건축으로 폴백. 뒤쪽은 전문건설업종(구분자 제거 후 매칭)
